# .github/workflows/publish.yml
name: Publish to PyPI

# Triggered when a GitHub release is published (e.g. via `gh release create vX.Y.Z`),
# or manually via workflow_dispatch for retries.
#
# Uses PyPI Trusted Publishing (OIDC) — no long-lived API token stored in the
# repo. One-time setup: register the project at pypi.org and add a Trusted
# Publisher pointing at (owner=Testimonial, repo=cognitive-castle,
# workflow=publish.yml, environment=pypi).
# https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#
# Until that setup is done this workflow will fail at the publish step;
# everything before it (build + verify tag) still runs and is useful as a
# sanity check on any release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v3.4.0). Manual runs only.'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify version.py matches tag
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          tag_version="${tag#v}"
          py_version=$(grep -E '^__version__' cognitive_castle/version.py | cut -d'"' -f2)
          if [[ "$tag_version" != "$py_version" ]]; then
            echo "::error::tag $tag ($tag_version) does not match cognitive_castle/version.py ($py_version)"
            exit 1
          fi
          echo "Tag/version match: $py_version"

      - name: Build sdist + wheel
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Upload built artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # OIDC token — required for Trusted Publishing
      id-token: write

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — Trusted Publishing (OIDC) provides the credential.
